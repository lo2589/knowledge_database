<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="km-app" content="known-manage">
<title>知识图</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="vendor/cdn-assets/styles/github.min.css">
<link rel="stylesheet" href="graph.css">
</head>
<body>
<header id="bar">
  <div class="grp">
    <select id="repo" title="知识仓库"></select>
    <input id="repo-new" class="w-md" placeholder="新仓库名 或 .db 路径，回车">
  </div>
  <div class="grp">
    <input id="search" class="w-sm" placeholder="搜卡片（命中的自动展开）">
    <button id="expand">全部展开</button>
    <button id="collapse">全部收起</button>
    <button id="fit">适配</button>
    <button id="export">导出 JSON</button>
  </div>
  <div class="grp">
    <input id="import" class="w-md" placeholder="导入：路径或粘贴文字，回车">
  </div>
  <div class="grp target" id="target"></div>
</header>
<div id="main">
  <aside id="outline"></aside>
  <div id="stage">
    <div id="layer"></div>
    <div id="msg" hidden></div>
  </div>
</div>
<footer id="legend"></footer>

<script src="vendor/markdown-it/markdown-it.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/contrib/mhchem.min.js"></script>
<script src="vendor/dompurify/purify.min.js"></script>
<script src="vendor/cdn-assets/highlight.min.js"></script>
<script src="render.js"></script>
<script src="graph.js"></script>
</body>
</html>
